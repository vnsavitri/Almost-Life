<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: Night Bordeaux rounded square -->
  <rect width="100" height="100" rx="20" fill="#52050A"/>

  <!-- Fork motif: stem rising from bottom, splitting into two paths -->
  <!-- Stem -->
  <line x1="50" y1="85" x2="50" y2="46"
    stroke="#BCD2EE" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Left branch -->
  <line x1="50" y1="46" x2="18" y2="17"
    stroke="#BCD2EE" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right branch -->
  <line x1="50" y1="46" x2="82" y2="17"
    stroke="#BCD2EE" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Fork junction dot: Royal Plum accent -->
  <circle cx="50" cy="46" r="4.5" fill="#832161"/>
</svg>
